<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CBT Pro Platform</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0f172a">
</head>
<body>

<div class="container">
  
  <!-- AUTH PORTAL (Fallback if Auto-Login fails) -->
  <div id="auth-page" class="card">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="margin:0;">Platform <span class="highlight-text">Login</span></h2>
    </div>
    
    <label style="color: #cbd5e1; font-weight: 600;">Email Address</label>
    <input type="text" id="login-id" class="input-field" placeholder="Enter registered email">
    
    <label style="color: #cbd5e1; font-weight: 600;">Password</label>
    <input type="password" id="login-pass" class="input-field" placeholder="Enter password">
    
    <button type="button" class="btn btn-primary" onclick="App.login()">Access Platform</button>
    <div id="auth-loading" class="hidden loader"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-page" class="card hidden">
    <h2>Welcome, <span id="dash-name" class="highlight-text"></span></h2>
    
    <div id="notification-box" class="notification-banner hidden"></div>
    
    <div id="exam-start-container" class="card" style="background:#0f172a; text-align:center; margin-top:20px;">
      <h3 id="paper-status-box" style="margin-bottom: 15px; color:#cbd5e1;">Loading paper status...</h3>
      <button type="button" id="btn-start-exam" class="btn btn-primary hidden" onclick="App.startExam()">Start CBT Exam Now</button>
    </div>
    
    <h3 style="margin-top: 30px; border-bottom: 2px solid #334155; padding-bottom: 10px;">Your Performance History</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Subject</th>
            <th>Score</th>
            <th>Correct</th>
            <th>Wrong</th>
            <th>Skip</th>
          </tr>
        </thead>
        <tbody id="history-table"></tbody>
      </table>
    </div>
    
    <button type="button" class="btn btn-secondary" style="margin-top: 25px;" onclick="App.logout()">Secure Logout</button>
  </div>

  <!-- EXAM SCREEN -->
  <div id="exam-page" class="hidden">
    <div class="timer-banner">Time Remaining: <span id="time-display" class="highlight-text">90:00</span></div>
    <form id="examForm">
      <div id="questions-container"></div>
      <button type="button" class="btn btn-primary" style="margin-top:20px;" onclick="App.submitExam(false)">Submit Final Exam</button>
    </form>
  </div>

</div>

<!-- UNANSWERED QUESTIONS MODAL -->
<div id="review-modal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="color: #facc15;">Unanswered Questions</h2>
    <p style="color:#cbd5e1;">You have skipped the following questions. They will receive 0 points.</p>
    <div id="missing-questions-list" class="missing-list"></div>
    <p style="color:#cbd5e1; margin-bottom: 20px;">Would you like to go back, or submit anyway?</p>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-secondary" style="margin-bottom:0;" onclick="document.getElementById('review-modal').style.display='none'">Go Back</button>
      <button class="btn btn-primary" style="margin-bottom:0;" onclick="App.forceSubmit()">Submit Anyway</button>
    </div>
  </div>
</div>

<!-- NOTIFICATION MODAL -->
<div id="custom-alert-modal" class="modal-overlay">
  <div class="modal-content">
    <h2 id="custom-alert-title" class="highlight-text" style="margin-bottom: 10px;">Notification</h2>
    <p id="custom-alert-message" style="margin-bottom: 25px; font-size: 1.1rem; color: #f8fafc;"></p>
    <button class="btn btn-primary" onclick="App.closeAlert()">Understood</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
